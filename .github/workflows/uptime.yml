name: Uptime Check
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Uptime Check
        run: |
          python3 -c '
          import urllib.request, json, datetime
          targets = {
              "CyberPulse Portfolio": "https://vexornull.github.io/cyberpulse/",
              "GitHub Profile": "https://github.com/VexorNull"
          }
          result = {}
          for name, url in targets.items():
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "VexorUptime/1.0"})
                  res = urllib.request.urlopen(req, timeout=10)
                  is_up = res.status in range(200, 400)
                  result[name] = {"online": is_up, "code": res.status, "checked_utc": str(datetime.datetime.utcnow())}
              except Exception as e:
                  result[name] = {"online": False, "error": str(e), "checked_utc": str(datetime.datetime.utcnow())}
          with open("status.json", "w") as f:
              json.dump(result, f, indent=2)
          '
      - name: Commit and Push Status Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -m "Auto: Update uptime status [skip ci]" || echo "No changes"
          git push origin HEAD:main || git push origin HEAD:master
