<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Status - Link Shortener Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0f19;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    .container {
      width: 100%;
      max-width: 600px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 24px;
      font-weight: 600;
    }
    #status-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .status-card {
      background-color: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .name {
      font-weight: 500;
      font-size: 1rem;
    }
    .badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 9999px;
      letter-spacing: 0.05em;
    }
    .operational {
      background-color: rgba(16, 185, 129, 0.15);
      color: #34d399;
    }
    .outage {
      background-color: rgba(239, 68, 68, 0.15);
      color: #f87171;
    }
    .checked {
      font-size: 0.75rem;
      color: #9ca3af;
    }
    footer {
      margin-top: 48px;
      font-size: 0.8125rem;
      color: #6b7280;
      text-align: center;
      border-top: 1px solid #1f2937;
      padding-top: 24px;
      width: 100%;
      max-width: 600px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>System Status</h1>
    <div id="status-container">
      <div class="status-card">
        <div class="card-top">
          <div class="name">Loading status...</div>
        </div>
      </div>
    </div>
  </div>
  <footer>
    Crafted by Tanveer Hussain (@vexornull)
  </footer>
  <script>
    async function loadStatus() {
      try {
        const res = await fetch('status.json?v=' + new Date().getTime());
        const data = await res.json();
        const container = document.getElementById('status-container');
        container.innerHTML = '';
        
        for (const [name, info] of Object.entries(data)) {
          const isUp = info.online;
          const card = document.createElement('div');
          card.className = 'status-card';
          card.innerHTML = `
            <div class="card-top">
              <div class="name">${name}</div>
              <div class="badge ${isUp ? 'operational' : 'outage'}">${isUp ? 'OPERATIONAL' : 'OUTAGE'}</div>
            </div>
            <div class="checked">Checked: ${info.checked_utc || ''}</div>
          `;
          container.appendChild(card);
        }
      } catch (err) {
        document.getElementById('status-container').innerHTML = `
          <div class="status-card">
            <div class="card-top">
              <div class="name">Failed to load status.json</div>
              <div class="badge outage">ERROR</div>
            </div>
          </div>
        `;
      }
    }
    loadStatus();
    setInterval(loadStatus, 30000);
  </script>
</body>
</html>
